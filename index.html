<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>theoneanother – Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#161616;--ink:#fff;--mut:#a3a3a3;--ln:#2b2b2b;--o:#ff6a00;--g:linear-gradient(135deg,#ff8a1f,#ff4d00);--ok:#3fb950;--bad:#f85149;--wr:#e3b341;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f4f4f4;--card:#fff;--ink:#0a0a0a;--mut:#555;--ln:#ddd;color-scheme:light}}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 480px at 90% -10%,#3a3a3a55,transparent),var(--bg);color:var(--ink);font:400 15px/1.5 Roboto,system-ui,sans-serif}
.ic{width:19px;height:19px;vertical-align:-4px}
button,.btn{font:700 13px Roboto,sans-serif;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;display:inline-block;text-decoration:none}
button:disabled{opacity:.5;cursor:wait}
.pri{background:var(--g);border-color:transparent;color:#0a0a0a}.sm{padding:4px 10px}.dng{border-color:var(--bad);color:var(--bad)}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.logo{font-weight:700;font-size:22px;letter-spacing:-.05em}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:18px 12px;border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:4px;overflow-y:auto}
aside .logo{padding:0 10px 14px}
.nv{display:flex;gap:10px;align-items:center;border:0;border-radius:10px;padding:10px 12px;font-weight:500;font-size:14px;width:100%;text-align:left}
.nv.on{background:var(--g);color:#0a0a0a}.nv.bot{margin-top:auto}.nv.bot~.nv.bot{margin-top:0}
.nv .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
main{padding:24px 4vw 60px}
h1{font-weight:900;font-size:clamp(28px,4vw,42px);letter-spacing:-.02em;text-transform:uppercase}
h3{font-size:16px;margin:18px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0}
.cd,.pan{background:linear-gradient(160deg,#242424,var(--card));border:1px solid var(--ln);border-radius:16px;padding:16px}
@media(prefers-color-scheme:light){.cd,.pan{background:var(--card)}}
.pan{margin-top:14px}
.cd span{color:var(--mut);font-size:13px}.cd b{display:block;font-size:26px;font-weight:900}
.go{cursor:pointer}.go:hover{border-color:var(--o)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.bars{display:flex;align-items:end;gap:6px;height:130px;padding-top:16px}
.bars div{flex:1;background:var(--g);border-radius:6px 6px 0 0;min-height:4px;position:relative}
.bars span{position:absolute;bottom:100%;left:-4px;right:-4px;text-align:center;font-size:10px;color:var(--mut)}
.lb{display:flex;gap:6px;font-size:10px;color:var(--mut);text-align:center}.lb i{flex:1;font-style:normal}
.w{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top;white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px;text-transform:uppercase}
tr.cl{cursor:pointer}tr.cl:hover{background:#ffffff0d}
input,select,textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit}
td input{width:78px;padding:5px 8px}
.bd{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:#ffffff18;display:inline-block;margin:1px 0}
.bd.ok{background:#3fb95030;color:var(--ok)}.bd.bad{background:#f8514930;color:var(--bad)}.bd.lo{background:#ff6a0030;color:var(--o)}.bd.wr{background:#e3b34130;color:var(--wr)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f{display:grid;gap:10px;max-width:560px}
.mut{color:var(--mut);font-size:13px}
.stp{display:flex;gap:4px;margin:8px 0}.stp span{flex:1;text-align:center;font-size:11px;padding:5px 2px;border-radius:8px;background:#ffffff12;color:var(--mut)}.stp .on{background:var(--g);color:#0a0a0a;font-weight:700}
.ph a{display:inline-block;margin:2px 0;color:var(--o);word-break:break-all}
dialog{border:1px solid var(--ln);border-radius:20px;background:var(--card);color:var(--ink);padding:20px;width:min(94vw,600px);max-height:92vh;overflow:auto}
dialog::backdrop{background:#000c}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login form,#login .box{width:min(92vw,400px);display:grid;gap:12px;background:linear-gradient(160deg,#242424,var(--card));border:1px solid var(--ln);border-radius:20px;padding:28px}
.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;font-weight:400;padding:0}
.toast{position:fixed;left:50%;bottom:20px;translate:-50% 0;background:var(--g);color:#0a0a0a;padding:10px 18px;border-radius:99px;font-weight:700;z-index:90;max-width:92vw;text-align:center}
[hidden]{display:none!important}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{height:auto;flex-direction:row;overflow-x:auto;padding:8px;z-index:20;background:var(--bg);border-right:0;border-bottom:1px solid var(--ln)}aside .logo{display:none}.nv{width:auto;white-space:nowrap}.nv.bot{margin-top:0}}
</style>
</head>

<script>

const CFG={url:"https://vxukroqdykktdcntmpee.supabase.co",key:"sb_publishable_K0f5xxBCVVYYQ0F07mSVFQ_mIX1Vklf"};
const REC=/type=recovery/.test(location.hash),RECERR=/error_code|error_description/.test(location.hash);
const $=i=>document.getElementById(i),inr=n=>"₹"+Number(n||0).toLocaleString("en-IN"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fdt=t=>new Date(t).toLocaleString("en-IN",{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"}),fd=t=>new Date(t).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
const IC={dash:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',ord:'<path d="M6 7h12l-1 13H7L6 7zM9 7a3 3 0 016 0"/>',nw:'<path d="M12 5v14M5 12h14"/>',cus:'<circle cx="9" cy="9" r="3"/><path d="M3 20c0-3.5 3-6 6-6s6 2.5 6 6M16 6a3 3 0 010 6M18 14c2 .7 3 2.6 3 5"/>',stock:'<path d="M12 3l8 4v10l-8 4-8-4V7l8-4zM4 7l8 4 8-4M12 11v10"/>',prod:'<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M20 16l-5-4-8 7"/>',rep:'<path d="M5 20V10M12 20V4M19 20v-7"/>',act:'<path d="M7 4h10v16H7zM10 8h4M10 12h4M10 16h2"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',key:'<circle cx="8" cy="12" r="3"/><path d="M11 12h9M17 12v3"/>',out:'<path d="M9 5H5v14h4M16 8l4 4-4 4M20 12H9"/>'};

const D=864e5,t0=()=>new Date().setHours(0,0,0,0);

const sb=CFG.url.includes("YOUR-")?null:supabase.createClient(CFG.url,CFG.key);

const go=v=>{if(location.hash.slice(1)==v)R();else location.hash=v};
/* ---------- data ---------- */
const live=o=>o.status!="cancelled",unv=o=>!o.paid&&live(o),stale=o=>unv(o)&&Date.now()-o.ts>D;
async function load(){
 const pgd=async()=>{let out=[];for(let f=0;f<10000;f+=1000){const r=must(await sb.from("orders").select("*,order_items(*)").order("created_at",{ascending:false}).order("id",{ascending:false}).range(f,f+999));out=out.concat(r);if(r.length<1000)break}return out};
 const[p,s,o,c]=await Promise.all([sb.from("products").select("id,name,type,active,category_id,image,variants(id,name,price,stock)").order("id"),sb.from("settings").select("*"),pgd(),sb.from("categories").select("*").order("position").order("id")]);
 CT=must(c);
 P=must(p).map(x=>({...x,variants:x.variants.sort((a,b)=>a.id-b.id)}));
 O=o.map(x=>({...x,ts:+new Date(x.created_at),total:+x.total,pay_amount:x.pay_amount==null?null:+x.pay_amount,order_items:x.order_items.sort((a,b)=>a.id-b.id)}));
 ST={};must(s).forEach(r=>ST[r.key]=r.value);
 DU={};O.forEach(x=>{if(x.utr&&live(x)){const k=x.utr.toLowerCase();DU[k]=(DU[k]||0)+1}});
 badge()}

const badge=()=>{const n=O.filter(unv).length;document.title=(n?`(${n}) `:"")+"theoneanother – Admin";const c=document.querySelector("#sb [data-v=ord] .cnt");if(c){c.textContent=n;c.hidden=!n}};
const wa=(t,n)=>`https://wa.me/${n||WA()}?text=${encodeURIComponent(t)}`;
const ph=p=>{let d=String(p).replace(/\D/g,"");if(d.length==11&&d[0]=="0")d=d.slice(1);return d.length==10?"91"+d:d};
const win=(a,b)=>O.filter(o=>o.ts>=a&&o.ts<b&&live(o)),units=o=>o.order_items.reduce((x,i)=>x+i.qty,0);
const sum=l=>({n:l.length,u:l.reduce((a,o)=>a+units(o),0),r:l.filter(o=>o.paid).reduce((a,o)=>a+o.total,0),p:l.filter(o=>!o.paid).length});
const lowList=()=>P.filter(p=>p.active).flatMap(p=>p.variants.filter(v=>v.stock<=low()).map(v=>({t:`${p.name} – ${v.name}`,s:v.stock})));
const stB=s=>s<=0?'<span class="bd bad">Out of stock</span>':s<=low()?'<span class="bd lo">Low</span>':'<span class="bd ok">In stock</span>';
const cell=v=>{v=String(v??"");if(/^(=|@|\t|\r|[+\-](?![\d ]))/.test(v))v="'"+v;return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const dl=(name,rows)=>{const b=new Blob(["﻿"+rows.map(r=>r.map(cell).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
const ordRows=l=>[["Order","Date","Customer","Phone","Email","Address","Items","Total","Payment verified","UTR","Status","Courier","Tracking","Source","Refunded"],...l.map(o=>[o.number,new Date(o.ts).toISOString().slice(0,10),o.customer_name,o.phone,o.email||"",o.address,o.order_items.map(i=>i.product_name+" "+i.variant_name+" x"+i.qty).join("; "),o.total,o.paid?"yes":"no",o.utr||"",o.status,o.courier||"",o.tracking||"",o.source||"",o.refunded?"yes":"no"])];
/* ---------- login / account ---------- */
function showLogin(msg,ok){if(!sb){$("login").hidden=false;$("login").innerHTML='<div class="box"><div class="logo" style="font-size:28px">theoneanother</div><p>Setup needed: open this file and paste your Supabase URL and anon key into <b>CFG</b> near the top of the script.</p></div>';return}
 $("login").hidden=false;$("app").hidden=true;$("login").innerHTML=`<form id="lf"><div class="logo" style="font-size:30px">theoneanother</div><p class="mut">Admin login ${msg?`<br><b style="color:var(${ok?"--ok":"--bad"})">${esc(msg)}</b>`:""}</p><input id="lu" type="email" placeholder="Email" autocomplete="username" required><input id="lp" type="password" placeholder="Password" autocomplete="current-password" required><button class="pri" style="padding:11px">Login</button><button type="button" class="lnk" id="fp">Forgot password?</button></form>`;
 $("lf").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector(".pri");b.disabled=true;const r=await sb.auth.signInWithPassword({email:$("lu").value.trim(),password:$("lp").value});b.disabled=false;if(r.error)return toast(/invalid login credentials/i.test(r.error.message)?"Wrong email or password":r.error.message);enter()};
 $("fp").onclick=async()=>{const em=$("lu").value.trim();if(!em)return toast("Type your email first");const r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});if(r.error)return toast(r.error.message);toast("If this email has an account, a reset link is on its way")}}
function showReset(){$("login").hidden=false;$("app").hidden=true;$("login").innerHTML=`<form id="rf"><div class="logo" style="font-size:30px">theoneanother</div><p class="mut">Choose a new password (at least 8 characters)</p><input id="r1" type="password" placeholder="New password" minlength="8" autocomplete="new-password" required><input id="r2" type="password" placeholder="Repeat new password" minlength="8" autocomplete="new-password" required><button class="pri" style="padding:11px">Save password</button></form>`;
 $("rf").onsubmit=async e=>{e.preventDefault();if($("r1").value!=$("r2").value)return toast("Passwords do not match");const r=await sb.auth.updateUser({password:$("r1").value});if(r.error)return toast(r.error.message);history.replaceState(null,"",location.pathname+location.search);toast("Password updated");enter()}}
function acct(){const dg=$("dg");dg.innerHTML=`<div class="row" style="justify-content:space-between"><h3 style="margin:0">Change my password</h3><button class="sm" id="x">Close</button></div><form class="f" id="pf" style="margin-top:12px"><input id="p1" type="password" placeholder="New password (8+ characters)" minlength="8" autocomplete="new-password" required><input id="p2" type="password" placeholder="Repeat new password" minlength="8" autocomplete="new-password" required><button class="pri" style="padding:10px">Update password</button></form>`;
 $("x").onclick=()=>dg.close();$("pf").onsubmit=async e=>{e.preventDefault();if($("p1").value!=$("p2").value)return toast("Passwords do not match");const r=await sb.auth.updateUser({password:$("p1").value});if(r.error)return toast(r.error.message);dg.close();toast("Password updated")};dg.showModal()}
async function enter(){const u=(await sb.auth.getUser()).data.user;if(!u)return showLogin();const pr=(await sb.from("profiles").select("name,role").eq("id",u.id).maybeSingle()).data;if(!pr){await sb.auth.signOut();return showLogin("This account has no staff access.")}me=pr;
 const ok=await run(load);if(ok===null&&!P.length&&!O.length&&!Object.keys(ST).length){me=null;return showLogin("Could not load data. Check your connection and try again.")}
 $("login").hidden=true;$("app").hidden=false;view=routeView();R()}
function nav(){const T=[["dash","Dashboard"],["ord","Orders"],["nw","New order"],["cus","Customers"],["stock","Stock"],["prod","Products"],["rep","Reports"]];if(me.role=="owner")T.push(["act","Activity"],["set","Settings"]);
 $("sb").innerHTML=`<div class="logo">theoneanother</div>${T.map(t=>`<button class="nv ${view==t[0]?"on":""}" data-v="${t[0]}">${ic(t[0])} ${t[1]}${t[0]=="ord"?'<span class="cnt" hidden></span>':""}</button>`).join("")}<button class="nv bot" id="pw">${ic("key")} Password</button><button class="nv bot" id="lo">${ic("out")} Logout (${esc(me.name||me.role)})</button>`;
 $("sb").onclick=async e=>{const b=e.target.closest("button");if(!b)return;if(b.id=="lo"){me=null;await sb.auth.signOut();return showLogin()}if(b.id=="pw")return acct();go(b.dataset.v)};badge()}
function R(){nav();const m=$("mn");m.onclick=null;m.onchange=null;m.oninput=null;m.onkeydown=null;({dash,ord,nw,cus,stock,prod,rep,act:actv,set})[view](m)}
const reload=async()=>{await run(load);R()};
/* ---------- dashboard ---------- */
const bars=(a,f)=>{const mx=Math.max(1,...a.map(f));return`<div class="bars">${a.map(d=>`<div title="${esc(d.t||"")}" style="height:${f(d)/mx*100}%"><span>${f(d)||""}</span></div>`).join("")}</div><div class="lb">${a.map(d=>`<i>${d.l}</i>`).join("")}</div>`};
function dash(m){const a=sum(win(t0(),t0()+D)),w=sum(win(t0()-6*D,t0()+D)),mo=sum(win(t0()-29*D,t0()+D)),pend=O.filter(unv),st=O.filter(stale),cf=O.filter(o=>o.status=="confirmed"),tr=O.filter(o=>o.status=="shipped"),rf=O.filter(o=>o.status=="cancelled"&&o.paid&&!o.refunded),lw=lowList();
 const days=[...Array(14)].map((_,i)=>{const s=t0()-(13-i)*D,l=win(s,s+D),r=sum(l);return{l:new Date(s).getDate(),n:l.length,r:r.r,t:new Date(s).toLocaleDateString("en-IN",{day:"numeric",month:"short"})+": "+l.length+" orders, "+inr(r.r)}});
 const mp={};win(t0()-29*D,t0()+D).forEach(o=>o.order_items.forEach(i=>mp[i.product_name]=(mp[i.product_name]||0)+i.qty));const top=Object.entries(mp).sort((x,y)=>y[1]-x[1]).slice(0,5);
 const G=(k,l,n,x)=>`<div class="cd go" role="button" tabindex="0" data-go="${k}"><span>${l}</span><b>${n}</b>${x||"&nbsp;"}</div>`;
 m.innerHTML=`<h1>Dashboard</h1><div class="cards">${[["Today",a],["Last 7 days",w],["Last 30 days",mo]].map(x=>`<div class="cd"><span>${x[0]}</span><b>${x[1].n} orders</b>${inr(x[1].r)} verified</div>`).join("")}</div>
<div class="cards">${G("unverified","Needs payment check",pend.length,st.length?`<span class="bd wr">${st.length} over 24h</span>`:"")}${G("confirmed","Confirmed: to print and ship",cf.length)}${G("shipped","On the way",tr.length)}${G("refund","Refunds to send",rf.length,rf.length?'<span class="bd bad">Action needed</span>':"")}</div>
<div class="two"><div class="pan"><b>Orders, last 14 days</b>${bars(days,d=>d.n)}</div><div class="pan"><b>Verified revenue, last 14 days (₹)</b>${bars(days,d=>d.r)}</div></div>
<div class="two"><div class="pan"><b>Low and out of stock</b>${lw.length?`<table>${lw.map(l=>`<tr><td>${esc(l.t)}</td><td>${l.s}</td><td>${stB(l.s)}</td></tr>`).join("")}</table><a class="btn pri sm" style="margin-top:10px" target="_blank" rel="noopener" href="${wa("Low stock alert:\n"+lw.map(l=>l.t+": "+l.s).join("\n"))}">Send WhatsApp alert</a>`:'<p class="mut">All items well stocked.</p>'}</div>
<div class="pan"><b>Top products (30 days)</b><p class="mut">${top.map(x=>esc(x[0])+" ("+x[1]+")").join(" · ")||"No orders yet"}</p><b style="display:block;margin-top:14px">Latest orders</b><div class="w"><table>${O.slice(0,6).map(o=>`<tr class="cl" data-o="${esc(o.number)}"><td>${esc(o.number)}</td><td>${esc(o.customer_name)}</td><td>${inr(o.total)}</td><td><span class="bd ${o.status=="cancelled"?"bad":""}">${o.status}</span></td></tr>`).join("")||'<tr><td class="mut">No orders yet</td></tr>'}</table></div></div></div>`;
 const g=e=>{const c=e.target.closest("[data-go]");if(c){fs=c.dataset.go;fr="all";q="";pg=1;go("ord");return}const r=e.target.closest("tr[data-o]");if(r)openO(r.dataset.o)};
 m.onclick=g;m.onkeydown=e=>{if(e.key=="Enter")g(e)}}
/* ---------- orders ---------- */
